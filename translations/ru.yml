start: Пришли текст или ссылку — сделаю QR. Пришли фото или файл изображения — прочитаю QR.
too_large: Пришли изображение размером до 10 МБ.
download_error: Не удалось скачать файл. Попробуй отправить его ещё раз.
not_found: QR не найден. Пришли более чёткое изображение, желательно файлом.
empty: QR найден, но в нём нет текста.
text_too_large: Текст слишком большой для QR. Попробуй сократить его.
unsupported: Пришли текст, фото или файл изображения.